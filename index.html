<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GTA Haiku</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Mobile UI Overlay */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .ui-element {
      pointer-events: auto;
    }

    /* Joystick */
    #joystick-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      touch-action: none;
    }

    #joystick-thumb {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(100, 200, 255, 0.6);
      border: 2px solid rgba(100, 200, 255, 0.9);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
    }

    /* Control Buttons */
    .control-buttons {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 80px;
      height: 80px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: all 0.1s ease;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(0.95);
    }

    .btn.primary {
      background: rgba(100, 200, 255, 0.2);
      border-color: rgba(100, 200, 255, 0.5);
    }

    .btn.primary:active {
      background: rgba(100, 200, 255, 0.4);
      border-color: rgba(100, 200, 255, 0.8);
    }

    /* HUD Info */
    #hud-info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(100, 200, 255, 0.8);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }

    .hud-line {
      margin: 4px 0;
    }

    /* Speed Indicator */
    #speed-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      color: rgba(255, 100, 100, 0.8);
      font-family: 'Courier New', monospace;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      text-align: right;
    }

    /* Action prompt */
    #action-prompt {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: rgba(100, 200, 255, 0.9);
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    #action-prompt.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui-container" class="ui-element">
      <div id="hud-info">
        <div class="hud-line">GTA HAIKU</div>
        <div class="hud-line" id="state-indicator">STATE: WALKING</div>
        <div class="hud-line" id="coords-indicator">X: 0 Z: 0</div>
      </div>

      <div id="speed-indicator">
        <div>0</div>
        <div style="font-size: 12px; opacity: 0.6;">KM/H</div>
      </div>

      <div id="joystick-container" class="ui-element"></div>
      <div id="joystick-thumb"></div>

      <div class="control-buttons">
        <button class="btn" id="accel-btn">ACCEL</button>
        <button class="btn" id="brake-btn">BRAKE</button>
        <button class="btn primary" id="action-btn">ACTION</button>
      </div>

      <div id="action-prompt">PRESS ACTION TO ENTER CAR</div>
    </div>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
